name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./prototype/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Linter (Ruff)
        working-directory: ./prototype/backend
        run: ruff check app/

      - name: Run Pytest (Unit Tests)
        working-directory: ./prototype/backend
        env:
          CI: "true"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/motel_db"
        run: |
          PYTHONPATH=. python -m pytest app/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./prototype/frontend/package-lock.json

      - name: Install NPM Packages
        working-directory: ./prototype/frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: ./prototype/frontend
        run: npm run build
